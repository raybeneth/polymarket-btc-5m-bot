version: '3.8'

services:
  mysql:
    image: mysql:8.4.10
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysql_jpdBm6
    ports:
      - "3306:3306"
    volumes:
      - /home/mysql-data:/var/lib/mysql
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: polymarket-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: mysql_jpdBm6
      MYSQL_DATABASE: polymarket_bot
      PRIVATE_KEY: 0xc9e156d6011b5bfd305c1bea8c0d4d082e7425b2043ed8662728068aa93acceb
      CLOB_API_KEY: 8f3b4235-6f37-d97c-6210-326bdaf20451
      CLOB_API_SECRET: FriNNfTt1Z2h6ygrnAW9x9DtSpM8IDd-aqbmvmSGx0g=
      CLOB_API_PASSPHRASE: c69fba8de75f0ef1622b31ecf1b12b82d74a52e232a9842866f05138c3563be1
      PAPER_TRADING: true
      TRADE_SIZE_USD: 10.0
      LOG_LEVEL: DEBUG
    volumes:
      - ./data:/data
    networks:
      - 1panel-network
    depends_on:
      mysql:
        condition: service_healthy

# 声明外部网络
networks:
  1panel-network:
    external: true
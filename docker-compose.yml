services:
  bot:
    build: .
    container_name: polymarket-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

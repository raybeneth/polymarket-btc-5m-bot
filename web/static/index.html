<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket BTC 5min Bot</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --font: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    min-height: 100vh;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .mode-badge {
    background: rgba(88, 166, 255, 0.15);
    color: var(--accent);
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .btc-price {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .conn-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .conn-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .conn-dot.off { background: var(--red); }

  /* Stats grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat-card {
    background: var(--card);
    padding: 16px 24px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 700;
  }
  .stat-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral { color: var(--text); }

  /* Section */
  .section {
    border-bottom: 1px solid var(--border);
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Positions table */
  .positions-table {
    width: 100%;
    border-collapse: collapse;
  }
  .positions-table th {
    text-align: left;
    padding: 8px 24px;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--card);
    font-weight: 500;
  }
  .positions-table td {
    padding: 10px 24px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .positions-table tr:hover td {
    background: rgba(88, 166, 255, 0.04);
  }
  .side-yes { color: var(--green); font-weight: 700; }
  .side-no { color: var(--red); font-weight: 700; }
  .empty-row {
    text-align: center;
    color: var(--text-dim);
    padding: 24px !important;
  }

  /* Log area */
  .log-container {
    height: 340px;
    overflow-y: auto;
    padding: 8px 0;
    background: var(--bg);
  }
  .log-container::-webkit-scrollbar { width: 6px; }
  .log-container::-webkit-scrollbar-track { background: var(--bg); }
  .log-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .log-line {
    padding: 2px 24px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .log-line:hover { background: rgba(255,255,255,0.02); }
  .log-line .ts { color: var(--text-dim); margin-right: 8px; }
  .log-line.signal { color: var(--accent); }
  .log-line.open-trade { color: var(--green); }
  .log-line.exit-win { color: var(--green); }
  .log-line.exit-loss { color: var(--red); }
  .log-line.warn { color: var(--yellow); }
  .log-line.settle-win { color: var(--green); }
  .log-line.settle-loss { color: var(--red); }

  /* WS status */
  .ws-status {
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <span class="logo">POLYMARKET BTC 5MIN</span>
    <span class="mode-badge" id="mode">PAPER</span>
  </div>
  <div class="header-right">
    <div>
      <span class="conn-dot off" id="btcDot"></span>
      <span class="btc-price" id="btcPrice">--</span>
    </div>
    <div id="uptime">00:00:00</div>
    <div class="ws-status">
      <span class="conn-dot off" id="wsDot"></span>
      <span id="wsLabel">disconnected</span>
    </div>
  </div>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Today Trades</div>
    <div class="stat-value neutral" id="todayTrades">0</div>
    <div class="stat-sub">All time: <span id="allTrades">0</span></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Win Rate</div>
    <div class="stat-value neutral" id="winRate">0%</div>
    <div class="stat-sub">W <span class="positive" id="wins">0</span> / L <span class="negative" id="losses">0</span> &nbsp; All: <span id="allWL">0/0</span></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Today P&L</div>
    <div class="stat-value" id="todayPnl">$0.00</div>
    <div class="stat-sub">All time: <span id="allPnl">$0.00</span></div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Markets</div>
    <div class="stat-value neutral" id="markets">0</div>
    <div class="stat-sub">active</div>
  </div>
</div>

<!-- Positions -->
<div class="section">
  <div class="section-header">
    <span class="section-title">Open Positions</span>
    <span style="color:var(--text-dim);font-size:11px" id="posCount">0</span>
  </div>
  <table class="positions-table">
    <thead>
      <tr>
        <th>Side</th><th>Entry</th><th>Qty</th><th>Hold</th>
        <th>Stop</th><th>Expiry</th><th>Order</th>
      </tr>
    </thead>
    <tbody id="posBody">
      <tr><td colspan="7" class="empty-row">No open positions</td></tr>
    </tbody>
  </table>
</div>

<!-- Logs -->
<div class="section">
  <div class="section-header">
    <span class="section-title">Live Log</span>
    <span style="color:var(--text-dim);font-size:11px" id="logCount">0 lines</span>
  </div>
  <div class="log-container" id="logContainer"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// ── WebSocket ──────────────────────────────────
let ws = null;
let reconnectTimer = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    $('wsDot').className = 'conn-dot on';
    $('wsLabel').textContent = 'connected';
  };

  ws.onclose = () => {
    $('wsDot').className = 'conn-dot off';
    $('wsLabel').textContent = 'reconnecting...';
    reconnectTimer = setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = e => {
    try { render(JSON.parse(e.data)); } catch(err) { console.error(err); }
  };
}

// ── Render ──────────────────────────────────────
function render(d) {
  // BTC
  if (d.btc_price) {
    $('btcPrice').textContent = '$' + d.btc_price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  } else {
    $('btcPrice').textContent = '--';
  }
  $('btcDot').className = 'conn-dot ' + (d.btc_connected ? 'on' : 'off');

  // Uptime
  if (d.uptime != null) {
    const h = Math.floor(d.uptime / 3600);
    const m = Math.floor((d.uptime % 3600) / 60);
    const s = d.uptime % 60;
    $('uptime').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // Stats — today
  const today = d.today || {};
  $('todayTrades').textContent = today.trades || 0;
  const w = today.wins || 0, l = today.losses || 0;
  const wr = (w + l) > 0 ? Math.round(w / (w + l) * 100) : 0;
  $('winRate').textContent = wr + '%';
  $('winRate').className = 'stat-value ' + (wr >= 50 ? 'positive' : wr > 0 ? 'negative' : 'neutral');
  $('wins').textContent = w;
  $('losses').textContent = l;

  const pnl = today.pnl || 0;
  $('todayPnl').textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
  $('todayPnl').className = 'stat-value ' + (pnl >= 0 ? 'positive' : 'negative');

  // Stats — all time
  const all = d.all_time || {};
  $('allTrades').textContent = all.trades || 0;
  $('allWL').textContent = `${all.wins || 0}/${all.losses || 0}`;
  const allPnl = all.pnl || 0;
  $('allPnl').textContent = (allPnl >= 0 ? '+' : '') + '$' + allPnl.toFixed(2);
  $('allPnl').className = allPnl >= 0 ? 'positive' : 'negative';

  // Markets
  $('markets').textContent = d.markets_count || 0;

  // Positions
  const positions = d.positions || [];
  $('posCount').textContent = positions.length;
  const tbody = $('posBody');
  if (positions.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-row">No open positions</td></tr>';
  } else {
    tbody.innerHTML = positions.map(p => {
      const cls = p.side === 'YES' ? 'side-yes' : 'side-no';
      const arrow = p.side === 'YES' ? '&#9650;' : '&#9660;';
      return `<tr>
        <td class="${cls}">${arrow} ${p.side}</td>
        <td>${p.entry.toFixed(3)}</td>
        <td>${p.qty.toFixed(2)}</td>
        <td>${p.hold}s</td>
        <td>${p.stop.toFixed(3)}</td>
        <td>${p.expiry}s</td>
        <td style="color:var(--text-dim);font-size:11px">${p.order_id}</td>
      </tr>`;
    }).join('');
  }

  // Logs
  const logs = d.logs || [];
  const container = $('logContainer');
  const wasAtBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 30;

  container.innerHTML = logs.map(line => {
    let cls = '';
    if (line.includes('SIGNAL')) cls = 'signal';
    else if (line.includes('OPEN')) cls = 'open-trade';
    else if (line.includes('EXIT') && line.includes('pnl=+')) cls = 'exit-win';
    else if (line.includes('EXIT') && line.includes('pnl=-')) cls = 'exit-loss';
    else if (line.includes('SETTLE') && line.includes('WIN')) cls = 'settle-win';
    else if (line.includes('SETTLE') && line.includes('LOSS')) cls = 'settle-loss';
    else if (line.includes('[W]')) cls = 'warn';
    return `<div class="log-line ${cls}">${escHtml(line)}</div>`;
  }).join('');

  $('logCount').textContent = logs.length + ' lines';

  if (wasAtBottom) {
    container.scrollTop = container.scrollHeight;
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

connect();
</script>
</body>
</html>
